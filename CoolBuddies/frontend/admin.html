<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CoolBuddies orders</title>
<style>
:root{color-scheme:light dark;--or:#f28c1b}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:Canvas;color:CanvasText}
.w{max-width:1100px;margin:auto;padding:20px}
h1{font-size:1.5rem;margin:0}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:14px}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:9px 16px;cursor:pointer;background:var(--or);color:#1b1100}
button.o{background:transparent;color:inherit;border:1px solid #8886}
button.on{outline:2px solid CanvasText}
:focus-visible{outline:3px solid var(--or);outline-offset:2px}
input{font:inherit;padding:10px 12px;border:1px solid #8886;border-radius:10px;background:Field;color:FieldText;width:100%;margin:6px 0 12px}
.card{max-width:380px;margin:12vh auto;padding:24px;border:1px solid #8886;border-radius:16px}
.t{overflow-x:auto}table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid #8884;vertical-align:top}
.m{font-size:.88rem;opacity:.75}
.b{padding:2px 10px;border-radius:99px;font-size:.85rem;font-weight:700;border:1px solid currentColor}
.Paid{color:#1a8f4a}.Pending{color:#b7791f}.Failed{color:#d4351c}
#err,#err2{color:#d4351c;font-weight:600}
</style></head><body><div class="w">
<div id="login" class="card"><h1>CoolBuddies admin</h1>
<form id="lf"><label for="pw">Password</label>
<input id="pw" type="password" autocomplete="current-password" required>
<button type="submit">Sign in</button><p id="err" role="alert"></p></form></div>

<div id="app" hidden>
<div class="bar"><h1>Orders</h1><div><button class="o" id="rf" type="button">Refresh</button> <button class="o" id="so" type="button">Sign out</button></div></div>
<div class="bar"><div id="fl"><button class="o on" type="button" data-s="">All</button> <button class="o" type="button" data-s="Paid">Paid</button> <button class="o" type="button" data-s="Pending">Pending</button> <button class="o" type="button" data-s="Failed">Failed</button></div><span id="sum" class="m"></span></div>
<p id="err2" role="alert"></p>
<div class="t"><table><thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th></tr></thead><tbody id="tb"></tbody></table></div>
</div></div>
<script>
const API=""; // same address as CONFIG.API in js/app.js, e.g. https://api.example.com
let token="",cur="";
const $=s=>document.querySelector(s),R=n=>"R "+Number(n).toLocaleString("en-ZA");
function el(tag,text,cls){const e=document.createElement(tag);if(text!=null)e.textContent=text;if(cls)e.className=cls;return e}
async function api(path,opt={}){
  const r=await fetch(API+path,{...opt,headers:{"Content-Type":"application/json",...(token?{Authorization:"Bearer "+token}:{})}});
  if(r.status===401&&token){out();throw new Error("Your session ended. Sign in again.")}
  if(!r.ok)throw new Error(r.status===429?"Too many attempts. Wait a minute and try again.":"Request failed.");
  return r.json()}
function out(){token="";$("#app").hidden=true;$("#login").hidden=false;$("#tb").replaceChildren()}
function draw(rows){
  const tb=$("#tb");tb.replaceChildren();let paid=0,sum=0;
  for(const o of rows){
    if(o.status==="Paid"){paid++;sum+=o.total}
    const tr=document.createElement("tr"),a=el("td"),b=el("td"),c=el("td"),d=el("td",R(o.total)),e=el("td");
    a.append(el("b","#"+o.id),el("div",new Date(o.createdAt+"Z").toLocaleString("en-ZA"),"m"));
    b.append(el("b",o.customer),el("div",o.phone,"m"),el("div",o.email,"m"));
    if(o.address)b.append(el("div",o.address,"m"));
    if(o.notes)b.append(el("div","Notes: "+o.notes,"m"));
    c.textContent=o.items||"";
    e.append(el("span",o.status,"b "+o.status));
    tr.append(a,b,c,d,e);tb.append(tr)}
  $("#sum").textContent=rows.length?`${rows.length} shown, ${paid} paid, ${R(sum)} paid total`:"No orders yet."}
async function load(s=cur){cur=s;$("#err2").textContent="";
  document.querySelectorAll("[data-s]").forEach(b=>b.classList.toggle("on",b.dataset.s===s));
  try{draw(await api("/api/admin/orders"+(s?"?status="+s:"")))}catch(x){$("#err2").textContent=x.message}}
$("#lf").onsubmit=async e=>{e.preventDefault();$("#err").textContent="";
  try{const d=await api("/api/admin/login",{method:"POST",body:JSON.stringify({password:$("#pw").value})});
    token=d.token;$("#pw").value="";$("#login").hidden=true;$("#app").hidden=false;load("")}
  catch(x){$("#err").textContent=x.message==="Request failed."?"Sign in failed. Check the password.":x.message}};
$("#fl").onclick=e=>{const b=e.target.closest("button");if(b)load(b.dataset.s)};
$("#rf").onclick=()=>load();$("#so").onclick=out;
</script></body></html>
